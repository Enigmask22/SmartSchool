[pytest]
testpaths = tests
python_files = test_*.py TS-*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    skip_in_ci: Skip in CI environment
    asyncio: Async tests
addopts = 
    -v
    --strict-markers
    --tb=short
norecursedirs = .git .venv venv __pycache__ *.egg-info .pytest_cache
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
